; خروجی‌های نصبی: Windows / Linux / Android
; پیش‌نیاز: دانلود Export Templates از ویرایشگر (Editor → Manage Export Templates)
; برای امضای APK: keystore release را در پروفایل تنظیم کنید (بلاکر مالک: انتشار رسمی).

[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/Bazino-Windows.exe"
encryption_include_filters=[]
encryption_exclude_filters=[]
encrypt_pck=false
encrypt_directory=false

